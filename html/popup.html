<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XXL.pics.FIND</title>
  <style>
    :root { color-scheme: light dark; --accent: #0a6cff; }
    body { margin: 0; width: 220px; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; }
    h1 img { width: 24px; height: 24px; }
    .toggle { display: flex; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle label { flex: 1; padding: 6px 0; text-align: center; color: var(--accent); cursor: pointer; }
    .toggle input:checked + label { background: var(--accent); color: #fff; }
    .toggle input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
    #scan { display: block; width: 100%; margin-top: 10px; padding: 7px 0; font: inherit; color: #fff;
            background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
    #scan:disabled { opacity: .6; cursor: default; }
    #scan-status { margin: 6px 0 0; min-height: 1.4em; color: GrayText; font-size: 12px; }
  </style>
</head>
<body>
  <h1><img src="../icons/icon-48.png" alt="">XXL.pics.FIND</h1>
  <div class="toggle" role="radiogroup" aria-label="Global enable/disable">
    <input type="radio" name="global-status" id="global-enable" checked>
    <label for="global-enable">Global Enable</label>
    <input type="radio" name="global-status" id="global-disable">
    <label for="global-disable">Global Disable</label>
  </div>
  <button id="scan" type="button">Find largest images on this page</button>
  <p id="scan-status" role="status"></p>
  <script src="../js/popup.js"></script>
</body>
</html>
