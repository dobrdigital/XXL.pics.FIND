<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="XXL.pics.FIND — find the largest version of any picture, hover download button and HiRes gallery for Chrome">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c140f"/>
      <stop offset="0.55" stop-color="#101a14"/>
      <stop offset="1" stop-color="#0b1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d8a35"/>
      <stop offset="1" stop-color="#5cc23d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="60" r="230" fill="#5cc23d" opacity="0.07"/>
  <circle cx="160" cy="390" r="200" fill="#1d8a35" opacity="0.05"/>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#9fb4a6" font-size="20" letter-spacing="4">CHROME EXTENSION · MANIFEST V3 · HIRES</text>
    <text x="72" y="160" fill="#ffffff" font-size="56" font-weight="700">XXL.<tspan fill="url(#accent)">pics</tspan>.FIND</text>
    <text x="72" y="206" fill="#d6e4da" font-size="24">Find the largest version of any picture — or of every picture on the page.</text>
    <text x="72" y="240" fill="#9fb4a6" font-size="20">Находит самую большую версию картинки — или всех картинок на странице.</text>
  </g>

  <!-- the hover download pill and the two menu lines -->
  <g transform="translate(72,270)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1136" height="58" rx="12" fill="#07100b" stroke="#244030" stroke-width="2"/>
    <rect x="20" y="13" width="196" height="32" rx="16" fill="url(#accent)"/>
    <text x="36" y="35" fill="#ffffff" font-size="15" font-weight="600">⬇ 1920×1080 · 454 KB</text>
    <text x="244" y="36" fill="#9fb4a6" font-size="16">hover button</text>
    <text x="420" y="36" fill="#d6e4da" font-size="16">XXL Find This HiRes</text>
    <text x="640" y="36" fill="#d6e4da" font-size="16">XXL Find All HiRes</text>
    <text x="840" y="36" fill="#9fb4a6" font-size="16">Alt+Shift+A</text>
  </g>
  <text x="72" y="368" fill="#7d9186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">hover download · right-click menu · shadow DOM · thumbnail → original · video · 40/40 tests</text>

  <text x="1208" y="368" fill="#5d6f64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" letter-spacing="2">REAILISM.DEV</text>
</svg>
